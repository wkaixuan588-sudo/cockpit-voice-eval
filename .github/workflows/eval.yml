# CI 轻量流水线(零密钥): 只跑不需要 API key 的检查,每次 push 自动执行
#   1) 评测集质量门禁: 全量加载 yaml + id 查重 + 必填字段校验
#   2) mock 冒烟: SUT_MODE=mock 本地桩,不调 API,验证代码可运行、SUT 输出结构正确
# 真模型评测(L1 规则断言/L2 judge)需要 API 额度,按需本地执行(pytest -m rule / judge),
# 产出提交至 reports/ 作为证据 —— 成本分层决策: CI 管结构与框架,本地管语义质量。
# 未来升级全量 CI 回归: 在 Settings 配置 Secret LLM_API_KEY,恢复 .env 注入与真模型命令即可。

name: eval

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: 评测集质量门禁 + mock 冒烟(零密钥)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装依赖
        run: pip install -e .
      - name: 评测集质量门禁(加载/id查重/必填字段)
        run: python -c "from evalsets import load_eval_cases; cs = load_eval_cases(); print(f'评测集校验通过: {len(cs)} 条')"
      - name: mock 冒烟(不调 API)
        # --ignore: test_judge 依赖 deepeval,零密钥流水线不装该可选依赖;收集它会报 ImportError
        run: SUT_MODE=mock pytest -m smoke -v --ignore=tests/test_judge.py
